<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Your codebase is a graph. Query it with Graf.</title>
  <desc id="desc">Graf provides seven times faster indexing, forty times faster search, and one native binary.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#12201a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="520" fill="#070b0a"/>
  <rect width="1200" height="520" fill="url(#grid)"/>

  <g fill="none" stroke-linecap="round" stroke-width="3">
    <path d="M890 92L1010 70L1140 130L1030 220L910 210L890 92M1010 70L1030 220M1140 130L1140 270L1030 220M910 210L850 355L960 380L1030 220M1140 270L1160 390L1080 425L960 380M1080 425L1160 390" stroke="#26332e"/>
    <path d="M890 92L910 210L1030 220L960 380L1080 425" stroke="#255a3d"/>
  </g>
  <g fill="#52625a">
    <circle cx="1010" cy="70" r="6"/><circle cx="1140" cy="130" r="6"/>
    <circle cx="1140" cy="270" r="6"/><circle cx="850" cy="355" r="6"/>
    <circle cx="1160" cy="390" r="6"/>
  </g>
  <g fill="#ff7a45" stroke="#4a2117" stroke-width="3">
    <circle cx="890" cy="92" r="13"/><circle cx="910" cy="210" r="13"/>
    <circle cx="1030" cy="220" r="13"/><circle cx="960" cy="380" r="13"/>
    <circle cx="1080" cy="425" r="13"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="70" y="130" fill="#f2f7f4" font-size="61" font-weight="700">Your codebase is a graph.</text>
    <text x="70" y="218" fill="#f2f7f4" font-size="61" font-weight="700">Query it with <tspan fill="#ff7a45" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">graf</tspan></text>
    <text x="72" y="318" fill="#93a49b" font-size="26">7× faster indexing  ·  40× faster search  ·  one native binary</text>
    <rect x="70" y="372" width="230" height="58" rx="12" fill="#ff7a45"/>
    <text x="97" y="409" fill="#07100b" font-size="21" font-weight="700">graphify, rebuilt</text>
  </g>
</svg>
