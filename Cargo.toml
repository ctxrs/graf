[package]
name = "graf-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A persistent local code graph for codebase navigation"
license = "Apache-2.0"
repository = "https://github.com/ctxrs/graf"
readme = "README.md"
keywords = ["code-graph", "code-search", "mcp", "python"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "graf"
path = "src/lib.rs"

[[bin]]
name = "graf"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4.33"
rmcp = { version = "3.4", features = ["server", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tree-sitter = "0.27"
tree-sitter-python = "0.25"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
